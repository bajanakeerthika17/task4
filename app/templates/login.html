{% extends "base.html" %}

{% block content %}
<main class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-header">
      <img src="/static/img/logo.svg" alt="SecureAuth Shield" class="brand-logo">
      <h1 class="brand-title">Welcome Back</h1>
      <p class="brand-subtitle">Enter your credentials to securely access your account</p>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <!-- Email Field -->
      <div class="form-group">
        <label for="login-email" class="form-label">Email Address</label>
        <div class="input-container">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
          </svg>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            class="form-input" 
            placeholder="you@company.com" 
            autocomplete="email"
            required
          >
        </div>
        <div class="field-error-msg" id="login-email-error"></div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="form-label">
          <label for="login-password">Password</label>
        </div>
        <div class="input-container">
          <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input 
            type="password" 
            id="login-password" 
            name="password" 
            class="form-input" 
            placeholder="••••••••••••" 
            autocomplete="current-password"
            required
          >
          <button type="button" class="input-toggle-btn" data-target="login-password" aria-label="Toggle password view">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
        <div class="field-error-msg" id="login-password-error"></div>
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="form-options">
        <label class="checkbox-label" for="remember-me">
          <input type="checkbox" id="remember-me" name="remember_me" class="custom-checkbox">
          <span>Remember for 30 days</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" id="btn-login-submit">
        <span class="btn-spinner"></span>
        <span class="btn-text">Sign In</span>
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account yet? 
      <a href="/register" class="auth-link">Create Account</a>
    </div>

    <!-- Cybersecurity Compliance Notice -->
    <div class="security-notice">
      <svg class="security-notice-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      <span>OWASP Compliant • Bcrypt/Argon2 • Sliding-Window Rate Limited</span>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
