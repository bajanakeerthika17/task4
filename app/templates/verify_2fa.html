{% extends "base.html" %}

{% block content %}
<main class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-header">
      <div style="width: 56px; height: 56px; margin: 0 auto 0.75rem auto; background: rgba(16, 185, 129, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.4);">
        <svg width="28" height="28" fill="none" stroke="#10b981" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0c0 2.473.345 4.866.99 7.132" />
        </svg>
      </div>
      <h1 class="brand-title">Two-Factor Challenge</h1>
      <p class="brand-subtitle">Enter the 6-digit verification code from your authenticator app</p>
      <div id="user-email-display" style="font-size: 0.8rem; color: #38bdf8; margin-top: 0.25rem;"></div>
    </div>

    <form id="verify-2fa-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="2fa-code" class="form-label" style="justify-content: center; font-size: 0.9rem;">
          6-Digit Security Code
        </label>
        <div class="input-container" style="justify-content: center;">
          <input 
            type="text" 
            id="2fa-code" 
            name="code" 
            class="form-input" 
            placeholder="000000" 
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            style="text-align: center; letter-spacing: 0.5em; font-size: 1.4rem; font-weight: 700; padding-left: 1rem;"
            required
            autofocus
          >
        </div>
        <div class="field-error-msg" id="code-error" style="text-align: center; justify-content: center;"></div>
      </div>

      <button type="submit" class="btn-primary" id="btn-2fa-submit">
        <span class="btn-spinner"></span>
        <span class="btn-text">Authenticate Session</span>
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </button>
    </form>

    <div class="auth-footer">
      <a href="/login" class="auth-link" style="display: inline-flex; align-items: center; gap: 0.35rem;">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Return to Login
      </a>
    </div>

    <div class="security-notice">
      <svg class="security-notice-icon" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
      <span>RFC 6238 TOTP Standard (Google Authenticator, Authy, MS Authenticator)</span>
    </div>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
